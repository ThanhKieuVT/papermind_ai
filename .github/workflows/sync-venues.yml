name: Sync conference deadlines

on:
  schedule:
    - cron: "17 2 * * *" # daily at 02:17 UTC (09:17 Vietnam time)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-venues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sync:venues
      - name: Commit updated snapshot (only if it changed)
        run: |
          if git diff --quiet -- public/data/venues.json; then
            echo "No deadline changes today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/venues.json
          git commit -m "chore(data): sync conference deadlines from ccfddl/ccf-deadlines"
          git push
